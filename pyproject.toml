[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synchro-vissim-ntcip-controller"
version = "1.0.0"
description = "Synchro UTDF -> NEMA TS2 dual-ring controller emulation, progression optimisation and NTCIP 1202 SNMP agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "pydantic>=2.6,<3", "pyyaml>=6.0", "matplotlib>=3.8"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
vissim = ["pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8.0"]

[project.scripts]
ntcip-ctrl = "ntcip_ctrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
